name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
      CLOUDFLARE_ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}

    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Deploy Worker and client assets to production
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: npm run deploy:production

      - name: Verify the deployed production revision
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          EXPECTED_DEPLOYMENT_VERSION: ${{ github.sha }}
        run: |
          retry_interval_seconds=10
          deadline=$(( $(date +%s) + 180 ))
          last_observed_version="<no valid health response>"

          echo "Waiting up to 3 minutes for production to report deployment version $EXPECTED_DEPLOYMENT_VERSION."
          while true; do
            response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$PRODUCTION_HEALTH_URL")" || response=""
            observed_version="$(printf '%s' "$response" | node --input-type=module --eval '
              let response = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { response += chunk; });
              process.stdin.on("end", () => {
                try {
                  const body = JSON.parse(response);
                  if (!body.ok || body.data?.status !== "ok" || body.data?.database !== "connected" || body.data?.schema !== "ready" || typeof body.data?.deploymentVersion !== "string") {
                    process.exitCode = 1;
                    return;
                  }
                  process.stdout.write(body.data.deploymentVersion);
                } catch {
                  process.exitCode = 1;
                }
              });
            ' 2>/dev/null)" || observed_version=""

            if [ -n "$observed_version" ]; then
              last_observed_version="$observed_version"
              if [ "$observed_version" = "$EXPECTED_DEPLOYMENT_VERSION" ]; then
                echo "Production is serving the deployed revision $EXPECTED_DEPLOYMENT_VERSION."
                exit 0
              fi
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Production verification failed after the propagation window. Expected SHA: $EXPECTED_DEPLOYMENT_VERSION. Last observed SHA: $last_observed_version."
              exit 1
            fi

            echo "Production has not reported the expected revision yet; retrying in ${retry_interval_seconds}s."
            sleep "$retry_interval_seconds"
          done
