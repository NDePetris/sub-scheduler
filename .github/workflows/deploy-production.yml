name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
      CLOUDFLARE_ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}

    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Deploy Worker and client assets to production
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: npm run deploy:production

      - name: Verify the deployed production revision
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          EXPECTED_DEPLOYMENT_VERSION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$PRODUCTION_HEALTH_URL" |
            node --input-type=module --eval '
              let response = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { response += chunk; });
              process.stdin.on("end", () => {
                const body = JSON.parse(response);
                if (!body.ok || body.data?.status !== "ok" || body.data?.deploymentVersion !== process.env.EXPECTED_DEPLOYMENT_VERSION) {
                  throw new Error("Production health endpoint did not report the deployed commit.");
                }
              });
            '
